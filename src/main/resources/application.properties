# Solução do cliente sobre a Athena. Credenciais nunca aqui: em desenvolvimento, config/application.properties
# (fora do git); na instalação, o application.properties ao lado do jar (o instalador pergunta).
spring.application.name=solucao
server.port=8091

# Banco padrão de desenvolvimento: H2 embutido. O banco do cliente vai no application.properties externo.
spring.datasource.url=jdbc:h2:file:./dados/solucao;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# A estrutura da Athena + a do cliente (db/cliente/master.yaml inclui as duas, nessa ordem)
spring.liquibase.change-log=classpath:db/cliente/master.yaml

athena.admin.login=admin
athena.admin.senha-inicial=

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
